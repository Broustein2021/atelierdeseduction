<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>L'Atelier de la Séduction</title>
  <style>
    @font-face {
      font-family: "Cinzel";
      src: url("./og-fonts/Cinzel-Regular.ttf") format("truetype"),
           url("./og-fonts/cinzel-latin.woff2") format("woff2");
      font-weight: 400 700;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "Cormorant Garamond";
      src: url("./og-fonts/cormorant-latin.woff2") format("woff2");
      font-weight: 400 700;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "Cormorant Garamond";
      src: url("./og-fonts/cormorant-italic-latin.woff2") format("woff2");
      font-weight: 400;
      font-style: italic;
      font-display: block;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }

    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      background:
        radial-gradient(ellipse 90% 70% at 50% 42%, #FBF7F3 0%, #F7F1EC 55%, #EFE6DF 100%);
      color: #2A211F;
      -webkit-font-smoothing: antialiased;
    }

    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.09;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.42  0 0 0 0 0.28  0 0 0 0 0.24  0 0 0 0.55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    .wash {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 0;
      height: 210px;
      background: radial-gradient(ellipse 80% 100% at 50% 100%, rgba(201,160,154,0.18), transparent 72%);
      pointer-events: none;
    }

    .frame {
      position: absolute;
      inset: 28px;
      border: 1px solid rgba(122, 46, 58, 0.38);
    }
    .frame-inner {
      position: absolute;
      inset: 36px;
      border: 1px solid rgba(201, 160, 154, 0.7);
    }

    .tick {
      position: absolute;
      width: 18px;
      height: 18px;
      border-color: #7A2E3A;
      border-style: solid;
      border-width: 0;
      opacity: 0.85;
    }
    .tick.tl { top: 28px; left: 28px; border-top-width: 1.5px; border-left-width: 1.5px; }
    .tick.tr { top: 28px; right: 28px; border-top-width: 1.5px; border-right-width: 1.5px; }
    .tick.bl { bottom: 28px; left: 28px; border-bottom-width: 1.5px; border-left-width: 1.5px; }
    .tick.br { bottom: 28px; right: 28px; border-bottom-width: 1.5px; border-right-width: 1.5px; }

    .lockup {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -52%);
      width: 760px;
      text-align: center;
    }

    .eyebrow {
      font-family: "Cinzel", "Liberation Serif", serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.46em;
      text-indent: 0.46em;
      color: #C9A09A;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .mono {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
      color: #7A2E3A;
      font-family: "Cinzel", "Liberation Serif", serif;
      font-size: 40px;
      font-weight: 500;
      letter-spacing: 0.08em;
      line-height: 1;
    }
    .mono span { display: block; padding-top: 10px; }
    .drop {
      width: 16px;
      height: 24px;
      margin-top: 2px;
    }

    .hair {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 0 auto 18px;
      width: 280px;
    }
    .hair i {
      display: block;
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, #C9A09A, transparent);
    }

    h1 {
      font-family: "Cinzel", "Liberation Serif", serif;
      font-weight: 500;
      color: #7A2E3A;
      line-height: 0.95;
    }
    h1 .line1 {
      display: block;
      font-size: 64px;
      letter-spacing: 0.22em;
      text-indent: 0.22em;
      font-weight: 500;
    }
    h1 .line2 {
      display: block;
      margin-top: 10px;
      font-size: 28px;
      letter-spacing: 0.38em;
      text-indent: 0.38em;
      font-weight: 400;
    }

    .tag {
      margin-top: 22px;
      font-family: "Cormorant Garamond", "Liberation Serif", serif;
      font-style: italic;
      font-size: 20px;
      letter-spacing: 0.18em;
      text-indent: 0.18em;
      color: #2A211F;
    }
    .place {
      margin-top: 8px;
      font-family: "Cinzel", "Liberation Serif", serif;
      font-size: 12px;
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      text-transform: uppercase;
      color: #C9A09A;
    }

    .bag {
      position: absolute;
      bottom: 58px;
      width: 72px;
      opacity: 0.55;
    }
    .bag.left { left: 86px; }
    .bag.right { right: 86px; transform: scaleX(-1); }

    .rose {
      position: absolute;
      bottom: 64px;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 28px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="wash"></div>
    <div class="frame"></div>
    <div class="frame-inner"></div>
    <div class="tick tl"></div>
    <div class="tick tr"></div>
    <div class="tick bl"></div>
    <div class="tick br"></div>

    <div class="lockup">
      <div class="eyebrow">Maison · Côte d’Ivoire</div>
      <div class="mono" aria-hidden="true">
        <span>A</span>
        <svg class="drop" viewBox="0 0 16 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 1.2C8 1.2 1.6 10.2 1.6 15.1a6.4 6.4 0 1 0 12.8 0C14.4 10.2 8 1.2 8 1.2z" fill="#C9A09A"/>
        </svg>
        <span>S</span>
      </div>
      <div class="hair"><i></i><i></i></div>
      <h1>
        <span class="line1">L’ATELIER</span>
        <span class="line2">DE LA SÉDUCTION</span>
      </h1>
      <div class="hair" style="margin-top: 20px; margin-bottom: 0; width: 220px;">
        <i></i>
        <svg width="10" height="14" viewBox="0 0 16 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 1.2C8 1.2 1.6 10.2 1.6 15.1a6.4 6.4 0 1 0 12.8 0C14.4 10.2 8 1.2 8 1.2z" fill="#7A2E3A"/>
        </svg>
        <i></i>
      </div>
      <p class="tag">Lingerie de luxe</p>
      <p class="place">Abidjan</p>
    </div>

    <svg class="bag left" viewBox="0 0 72 88" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M14 30 L20 82 H52 L58 30 Z" fill="#C9A09A"/>
      <path d="M14 30 H58 L56 24 H16 Z" fill="#B58B85"/>
      <path d="M27 30 C27 18 32 12 36 12 C40 12 45 18 45 30" fill="none" stroke="#7A2E3A" stroke-width="2.2" stroke-linecap="round"/>
      <rect x="30" y="40" width="12" height="8" rx="1" fill="#F7F1EC" opacity="0.55"/>
    </svg>
    <svg class="bag right" viewBox="0 0 72 88" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M14 30 L20 82 H52 L58 30 Z" fill="#C9A09A"/>
      <path d="M14 30 H58 L56 24 H16 Z" fill="#B58B85"/>
      <path d="M27 30 C27 18 32 12 36 12 C40 12 45 18 45 30" fill="none" stroke="#7A2E3A" stroke-width="2.2" stroke-linecap="round"/>
      <rect x="30" y="40" width="12" height="8" rx="1" fill="#F7F1EC" opacity="0.55"/>
    </svg>

    <svg class="rose" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M16 28 C16 28 8 22 8 14 C8 9 12 6 16 10 C20 6 24 9 24 14 C24 22 16 28 16 28Z" fill="#C9A09A"/>
      <circle cx="16" cy="14" r="3.2" fill="#7A2E3A" opacity="0.35"/>
    </svg>

    <div class="grain"></div>
  </div>
</body>
</html>
